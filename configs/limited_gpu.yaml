extends: lora.yaml
device: cuda
output_dir: results/limited_gpu
model:
  model_id: Qwen/Qwen2.5-0.5B
  revision: main
  dtype: float32
  gradient_checkpointing: true
data:
  max_length: 128
  train_samples: 2048
  validation_samples: 256
  test_samples: 512
training:
  max_steps: 250
  batch_size: 1
  gradient_accumulation: 16
  mixed_precision: fp16
  warmup_steps: 10
  validation_interval: 25
